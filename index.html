<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日记</title>
  <meta name="description" content="一页一天。写了就算数，没写也不会被催。">
  <meta name="theme-color" content="#fbf7f1">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="日记">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/css/app.css?v=1.1.5">
</head>
<body>
  <div class="app" id="app">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="rail" id="rail">
      <a class="rail__brand" href="#/write" data-nav>
        <span class="rail__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4.5h11.5A2.5 2.5 0 0 1 19 7v13H7.5A2.5 2.5 0 0 1 5 17.5z"/>
            <path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H19"/>
          </svg>
        </span>
        <span class="rail__name">日记</span>
      </a>
      <nav class="rail__nav" id="nav"></nav>
      <p class="rail__foot" id="rail-foot"></p>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="topbar__menu" id="menu-btn" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="rail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="topbar__title" id="topbar-title">写</h1>
      </header>
      <div class="page" id="page" tabindex="-1"></div>
    </main>
  </div>


  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>

  <script>
    // 一次性清掉旧版遗留的 Service Worker 与缓存，之后由 main.js 重新注册
    (function () {
      try {
        if (localStorage.getItem("sw-reset-1.1.5")) return;
        localStorage.setItem("sw-reset-1.1.4", "1");
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (list) {
            list.forEach(function (r) { r.unregister(); });
          });
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (e) {}
    })();
  </script>
  <script type="module" src="./assets/js/main.js?v=1.1.4"></script>
</body>
</html>
