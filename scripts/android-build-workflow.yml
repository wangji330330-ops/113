# Optional GitHub Actions workflow.
# Copy this file to .github/workflows/android.yml after committing it
# with a token that has the workflow scope.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          rm -rf android/app/src/main/assets/www/*
          cp -R index.html manifest.webmanifest sw.js version.json assets android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/assets/js/app.js

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glimmer-nook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

